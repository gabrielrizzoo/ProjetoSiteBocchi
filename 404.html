<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página não encontrada — Bocchi The Rock!">
    <title>404 — Página não encontrada | Bocchi The Rock!</title>
    <!-- Tema salvo aplicado antes da primeira pintura -->
    <script>
        document.documentElement.classList.add('js');
        try {
            if (localStorage.getItem('bocchiTheme') === 'light') document.documentElement.classList.add('light-theme');
        } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/images/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png">
    <meta name="theme-color" content="#0d0c10">
    <meta name="color-scheme" content="dark light">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Yusei+Magic&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
    <link rel="stylesheet" href="./global.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 48px var(--gutter);
        }

        .error-inner {
            max-width: 640px;
        }

        .error-code {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 18px 0 8px;
            font-family: var(--font-display);
            font-stretch: 70%;
            font-weight: 900;
            font-size: clamp(6rem, 22vw, 12rem);
            line-height: 0.85;
            letter-spacing: -0.02em;
            color: var(--hero-highlight);
        }

        .error-code .sticker {
            font-size: clamp(1rem, 3vw, 1.4rem);
            letter-spacing: 0.04em;
        }

        .error-title {
            margin-bottom: 14px;
            font-stretch: 80%;
            font-weight: 800;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            text-transform: uppercase;
        }

        .error-description {
            max-width: 46ch;
            margin-bottom: 32px;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-muted);
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
    </style>
</head>

<body>
    <main class="error-page">
        <div class="error-inner">
            <a href="./index.html" class="brand" aria-label="Bocchi the Rock! — página inicial">
                <img id="logo" src="./assets/images/Logo Bocchi 2.png" alt="" width="2560" height="793">
            </a>
            <p class="error-code">404 <span class="sticker" lang="ja" aria-hidden="true">迷子</span></p>
            <h1 class="error-title">Essa nota não existe na partitura</h1>
            <p class="error-description">
                Parece que a Bocchi se perdeu de novo e levou esta página junto. Mas calma, a Kessoku Band
                te leva de volta.
            </p>
            <div class="error-actions">
                <a href="./index.html" class="btn btn-primary">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                    Voltar ao início
                </a>
                <a href="./fotos.html" class="btn btn-ghost">
                    <span class="material-symbols-outlined" aria-hidden="true">photo_library</span>
                    Ver galeria
                </a>
            </div>
        </div>
    </main>
</body>

</html>
